components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer or administrator access token as declared by x-access.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of records per page. Defaults to 20; maximum is 100. Larger values are rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Locale:
      name: locale
      in: query
      required: false
      description: Requested localized content language.
      schema:
        $ref: '#/components/schemas/Locale'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReturnId:
      name: returnId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CouponId:
      name: couponId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BannerId:
      name: bannerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    Problem:
      description: >-
        Shared RFC 9457 response for validation, authentication, authorization,
        not-found, conflict, and server errors. The status field carries the HTTP
        status code and code carries a stable machine-readable application code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
    Locale:
      type: string
      enum: [bn, en]
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Integer amount in Bangladeshi poisha; 100 poisha equals 1 BDT.
    Problem:
      type: object
      description: RFC 9457 problem details with a stable application code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe client-facing explanation; internal details and secrets are excluded.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    PageMetadata:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, error]
        checks:
          type: object
          required: [database, schema]
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
            schema:
              $ref: '#/components/schemas/HealthCheck'
    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          pattern: '^[^A-Z]+$'
        password:
          type: string
          minLength: 1
          writeOnly: true
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
    AuthSession:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
        user:
          anyOf:
            - $ref: '#/components/schemas/AdminUser'
            - $ref: '#/components/schemas/Customer'
    AdminUser:
      type: object
      required: [id, email, displayName, status, role, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, disabled]
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
    AdminUserCreate:
      type: object
      required: [email, password, displayName, roleId]
      properties:
        email:
          type: string
          format: email
          pattern: '^[^A-Z]+$'
        password:
          type: string
          minLength: 1
          writeOnly: true
        displayName:
          type: string
          minLength: 1
        roleId:
          $ref: '#/components/schemas/Id'
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, disabled]
        roleId:
          $ref: '#/components/schemas/Id'
    Role:
      type: object
      required: [id, key, name, scope, system, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [store, platform]
        system:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    RoleInput:
      type: object
      required: [key, name, scope, permissionKeys]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        name:
          type: string
          minLength: 1
        description:
          type: string
        scope:
          type: string
          enum: [store, platform]
        permissionKeys:
          type: array
          uniqueItems: true
          items:
            type: string
    Permission:
      type: object
      required: [key, group, sortOrder]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        description:
          type: string
        group:
          type: string
        sortOrder:
          type: integer
    MediaAsset:
      type: object
      required: [id, provider, key, mimeType, sizeBytes, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
          const: r2
        key:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        alt:
          type: object
          properties:
            bn:
              type: string
            en:
              type: string
        url:
          type: string
          format: uri
          readOnly: true
        createdAt:
          type: string
          format: date-time
    MediaUploadRequest:
      type: object
      required: [fileName, mimeType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        alt:
          type: object
          properties:
            bn:
              type: string
            en:
              type: string
    Category:
      type: object
      required: [id, status, sortOrder, content]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [active, archived]
        sortOrder:
          type: integer
        content:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocalizedContent'
          propertyNames:
            enum: [bn, en]
        imageId:
          $ref: '#/components/schemas/Id'
    CategoryInput:
      type: object
      required: [content]
      properties:
        parentId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [active, archived]
        sortOrder:
          type: integer
        imageId:
          $ref: '#/components/schemas/Id'
        content:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/LocalizedContent'
          propertyNames:
            enum: [bn, en]
    LocalizedContent:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    Product:
      type: object
      required: [id, categoryId, status, content, variants]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        categoryId:
          $ref: '#/components/schemas/Id'
        brandId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ProductStatus'
        content:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocalizedContent'
          propertyNames:
            enum: [bn, en]
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    Brand:
      type: object
      required: [id, status, content]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [active, archived]
