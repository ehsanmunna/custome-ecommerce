openapi: 3.1.0
info:
  title: Custom E-commerce API
  version: 1.0.0
  summary: Versioned REST API for the shared custom e-commerce platform.
  description: >-
    Canonical contract for the planned v1 API. Only operations listed in
    x-implemented-operations are currently available; other operations describe
    the planned integration boundary and are implemented by their feature changes.
  contact:
    name: API maintainers
servers:
  - url: /v1
    description: Version 1 API base path
x-implemented-operations:
  - GET /health/live
  - GET /health/ready
  - POST /admin/auth/login
  - POST /admin/auth/refresh
  - POST /admin/auth/logout
  - GET /admin/auth/me
  - POST /storefront/customers
  - POST /storefront/customers/auth/login
  - POST /storefront/customers/auth/otp
  - POST /storefront/customers/auth/otp/verify
  - POST /storefront/customers/auth/refresh
  - POST /storefront/customers/auth/logout
  - GET /storefront/customers/me
  - GET /storefront/categories
  - GET /storefront/categories/{slug}/products
  - GET /storefront/products
  - GET /storefront/products/{slug}
  - GET /storefront/brands
  - GET /storefront/brands/{slug}
  - GET /admin/brands
  - POST /admin/brands
  - PATCH /admin/brands/{brandId}
  - DELETE /admin/brands/{brandId}
  - GET /admin/categories
  - POST /admin/categories
  - PATCH /admin/categories/{categoryId}
  - DELETE /admin/categories/{categoryId}
  - GET /admin/categories/{categoryId}/attributes
  - POST /admin/categories/{categoryId}/attributes
  - GET /admin/products
  - POST /admin/products
  - GET /admin/products/{productId}
  - PATCH /admin/products/{productId}
  - DELETE /admin/products/{productId}
  - POST /admin/products/{productId}/variants
  - PATCH /admin/variants/{variantId}
  - DELETE /admin/variants/{variantId}
tags:
  - name: Health
  - name: Admin authentication
  - name: Admin users
  - name: Roles and permissions
  - name: Media
  - name: Storefront catalog
  - name: Admin catalog
  - name: Inventory
  - name: Customer authentication
  - name: Customer account
  - name: Carts and checkout
  - name: Storefront orders
  - name: Admin orders
  - name: Returns
  - name: Payments
  - name: Shipping
  - name: Promotions
  - name: Store settings
  - name: Storefront CMS
  - name: Admin CMS
  - name: Notifications
  - name: Analytics
paths:
  /health/live:
    get:
      operationId: healthLive
      tags: [Health]
      summary: Check process liveness
      description: Implemented. Reports only that the API process is running.
      security:
        - bearerAuth: []
      x-access: customer
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      operationId: healthReady
      tags: [Health]
      summary: Check service readiness
      description: Implemented. Readiness includes database connectivity and schema compatibility.
      security:
        - bearerAuth: []
      x-access: customer
      responses:
        '200':
          description: The service can accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: The service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin authentication]
      summary: Authenticate an administrator
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Authenticated administrator and bearer tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/refresh:
    post:
      operationId: adminRefreshSession
      tags: [Admin authentication]
      summary: Refresh an administrator session
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed bearer tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin authentication]
      summary: End the current administrator session
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.auth.logout
      responses:
        '204':
          description: Session ended.
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/me:
    get:
      operationId: getCurrentAdmin
      tags: [Admin authentication]
      summary: Get the current administrator
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.auth.read
      responses:
        '200':
          description: Current administrator and effective role permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin users]
      summary: List administrators
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.users.read
      responses:
        '200':
          description: Paginated administrators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminUser
      tags: [Admin users]
      summary: Create an administrator
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.users.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
      responses:
        '201':
          description: Administrator created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getAdminUser
      tags: [Admin users]
      summary: Get an administrator
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.users.read
      responses:
        '200':
          description: Administrator details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateAdminUser
      tags: [Admin users]
      summary: Update an administrator
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.users.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: Administrator updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAdminUser
      tags: [Admin users]
      summary: Delete an administrator
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.users.delete
      responses:
        '204':
          description: Administrator deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/roles:
    get:
      operationId: listRoles
      tags: [Roles and permissions]
      summary: List roles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.roles.read
      responses:
        '200':
          description: Paginated roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRole
      tags: [Roles and permissions]
      summary: Create a role with permission grants
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.roles.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /admin/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    patch:
      operationId: updateRole
      tags: [Roles and permissions]
      summary: Update a role and its grants
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.roles.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRole
      tags: [Roles and permissions]
      summary: Delete a non-system role that is not in use
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.roles.delete
      responses:
        '204':
          description: Role deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/permissions:
    get:
      operationId: listPermissions
      tags: [Roles and permissions]
      summary: List the permission catalog
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: admin.roles.read
      responses:
        '200':
          description: Paginated permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/media:
    get:
      operationId: listMedia
      tags: [Media]
      summary: List media assets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: media.read
      responses:
        '200':
          description: Paginated media assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createMediaUpload
      tags: [Media]
      summary: Create a media upload
      description: Upload transport and provider details are determined by the media feature.
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: media.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '201':
          description: Upload instruction and media record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        default:
          $ref: '#/components/responses/Problem'
  /admin/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    delete:
      operationId: deleteMedia
      tags: [Media]
      summary: Delete a media record and schedule object cleanup
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: media.delete
      responses:
        '204':
          description: Media record deleted.
        default:
          $ref: '#/components/responses/Problem'
  /storefront/categories:
    get:
      operationId: listStorefrontCategories
      tags: [Storefront catalog]
      summary: List active categories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Locale'
      security: []
      x-access: public
      responses:
        '200':
          description: Paginated active categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        default:
          $ref: '#/components/responses/Problem'
  /storefront/categories/{slug}/products:
    get:
      operationId: listProductsByCategory
      tags: [Storefront catalog]
      summary: List active products in a category
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Locale'
      security: []
      x-access: public
      responses:
        '200':
          description: Paginated products in the category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        default:
          $ref: '#/components/responses/Problem'
  /storefront/products:
    get:
      operationId: searchStorefrontProducts
      tags: [Storefront catalog]
      summary: Search and list active products
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Locale'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
      security: []
      x-access: public
      responses:
        '200':
          description: Paginated active products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        default:
          $ref: '#/components/responses/Problem'
  /storefront/products/{slug}:
    get:
      operationId: getStorefrontProduct
      tags: [Storefront catalog]
      summary: Get an active product by localized slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Locale'
      security: []
      x-access: public
      responses:
        '200':
          description: Product details, variants, localized content, and media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /storefront/brands:
    get:
      operationId: listStorefrontBrands
      tags: [Storefront catalog]
      summary: List active brands
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Locale'
      security: []
      x-access: public
      responses:
        '200':
          description: Paginated active brands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        default:
          $ref: '#/components/responses/Problem'
  /storefront/brands/{slug}:
    get:
      operationId: getStorefrontBrand
      tags: [Storefront catalog]
      summary: Get an active brand by localized slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Locale'
      security: []
      x-access: public
      responses:
        '200':
          description: Brand and localized details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Problem'
  /admin/brands:
    get:
      operationId: listAdminBrands
      tags: [Admin catalog]
      summary: List brands
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.brands.read
      responses:
        '200':
          description: Paginated brands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBrand
      tags: [Admin catalog]
      summary: Create a localized brand
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.brands.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          description: Brand created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Problem'
  /admin/brands/{brandId}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    patch:
      operationId: updateBrand
      tags: [Admin catalog]
      summary: Update a localized brand
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.brands.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '200':
          description: Brand updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBrand
      tags: [Admin catalog]
      summary: Delete a brand
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.brands.delete
      responses:
        '204':
          description: Brand deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [Admin catalog]
      summary: List categories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.read
      responses:
        '200':
          description: Paginated categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCategory
      tags: [Admin catalog]
      summary: Create a localized category
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          $ref: '#/components/responses/Problem'
  /admin/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      operationId: updateCategory
      tags: [Admin catalog]
      summary: Update a category and localized content
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCategory
      tags: [Admin catalog]
      summary: Delete an unused category
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.delete
      responses:
        '204':
          description: Category deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/categories/{categoryId}/attributes:
    get:
      operationId: listCategoryAttributes
      tags: [Admin catalog]
      summary: List category attribute definitions
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.read
      responses:
        '200':
          description: Paginated attribute definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCategoryAttribute
      tags: [Admin catalog]
      summary: Create a category attribute definition
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.categories.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDefinitionInput'
      responses:
        '201':
          description: Attribute definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        default:
          $ref: '#/components/responses/Problem'
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [Admin catalog]
      summary: List products for administration
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.read
      responses:
        '200':
          description: Paginated products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProduct
      tags: [Admin catalog]
      summary: Create a product
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /admin/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getAdminProduct
      tags: [Admin catalog]
      summary: Get a product for administration
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.read
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProduct
      tags: [Admin catalog]
      summary: Update product content and lifecycle
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProduct
      tags: [Admin catalog]
      summary: Delete a product and its unreferenced catalog data
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.delete
      responses:
        '204':
          description: Product deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: createVariant
      tags: [Admin catalog]
      summary: Create a sellable product variant
      security:
        - bearerAuth: []
      x-access: admin
      x-required-permission: catalog.products.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantInput'
      responses:
        '201':
          description: Variant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        default:
